spring.application.name=mpcalc-backend
server.port=8080
server.servlet.context-path=/api

# Compose passes SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (infra/docker-compose.yml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mpcalc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mpcalc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Used from phase 5 (MCP server); read now so the name is fixed.
mpcalc.mcp-api-key=${MCP_API_KEY:}

# Messages (Spring i18n): messages.properties is Hungarian and is the default; messages_en.properties is English.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false

# A decimal such as 20.5 in a whole-number field is an error, never cut to 20.
spring.jackson.deserialization.accept-float-as-int=false

# MCP server (phase 5): the tools of the chat service at /api/mcp. Stateless: every call carries the player and character ids.
spring.ai.mcp.server.name=mpcalc
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.instructions=Tools for the MPCalc magic system. Use them for every number (MP, E, duration, casting time); never compute them yourself. If the player's request is unclear (which mosaic, which objective, how long), ask the player instead of guessing.

# The login cookie must also reach the chat service (/chat/...): without this Spring limits it to the context path /api.
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
