<mat-card class="chat" data-testid="chat-box">
  <mat-card-header><mat-card-title>{{ T.chat.title }}</mat-card-title></mat-card-header>
  <mat-card-content>
    <div class="list" #list aria-live="polite" data-testid="chat-list">
      @if (shown().length === 0) {
        <p class="hint">{{ T.chat.hint }}</p>
      }
      @for (m of shown(); track $index) {
        <div class="msg" [class.user]="m.role === 'user'" [class.error]="m.error" [attr.data-testid]="'chat-' + m.role">
          <span class="who">{{ m.role === 'user' ? T.chat.you : T.chat.assistant }}</span>
          <div class="text">{{ m.text }}</div>
        </div>
      }
      @if (status()) { <p class="status" data-testid="chat-status">{{ status() }}</p> }
    </div>
    <mat-form-field class="input">
      <mat-label>{{ T.chat.placeholder }}</mat-label>
      <textarea matInput rows="2" [ngModel]="question()" (ngModelChange)="question.set($event)" (keydown)="onKey($event)" name="question" data-testid="chat-input"></textarea>
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    @if (busy()) {
      <button mat-stroked-button type="button" (click)="stop()" data-testid="chat-stop">{{ T.chat.stop }}</button>
    } @else {
      <button mat-flat-button type="button" [disabled]="!question().trim()" (click)="send()" data-testid="chat-send">{{ T.chat.send }}</button>
    }
    <button mat-button type="button" (click)="reset()" data-testid="chat-new">{{ T.chat.newConversation }}</button>
  </mat-card-actions>
</mat-card>
