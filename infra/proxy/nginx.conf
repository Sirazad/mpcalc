# HTTP only for now. HTTPS (certificates, domain) belongs to phase 7.
# Names are resolved at request time (Docker DNS) so nginx starts even if a service is down.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # compiled Angular files (mounted folder)
    index index.html;

    # The MCP endpoint is for the chat service on the internal network only (it also needs the API key). Never published.
    location /api/mcp {
        return 404;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;      # path is passed unchanged (/api/... stays /api/...)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat/ {
        set $chat http://chat:8000;
        proxy_pass $chat;         # path is passed unchanged (/chat/... stays /chat/...)
        proxy_http_version 1.1;
        proxy_buffering off;      # in case replies are streamed (undecided)
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build files with a hash in their name (main-XXXXXXXX.js, styles-XXXXXXXX.css) never change under the same name: cache them for a year.
    location ~ "^/[A-Za-z0-9._-]+-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (index.html, the Angular routes, icons): the browser asks the server every time whether it changed (ETag),
    # so a new build shows at once and no old page is kept after an update.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;   # Angular client-side routes
    }
}
